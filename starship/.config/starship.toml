"$schema" = 'https://starship.rs/config-schema.json'

format = """
$jobs\
$username\
$hostname\
$directory\
$git_status\
cmd_duration\
$git_branch\
$git_state\
$aws\
$python\
$line_break\
$character"""

[directory]
style = "blue"

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](blue)"

[git_branch]
format = "git [$branch]($style)"
style = "bright-black"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
style = "cyan"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[python]
format = " | venv [$virtualenv]($style) "
style = "bright-black"
detect_extensions = []
detect_files = []

[aws]
format = ' | aws [$profile]($style)'
